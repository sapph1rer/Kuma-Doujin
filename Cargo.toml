[package]
name = "kumadoujin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
