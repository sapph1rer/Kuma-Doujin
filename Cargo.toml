[package]
name = "kumadoujin"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3", default-features = false }
async-trait = "0.1.92"
eframe = "0.37.0"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
regex = "1.10.6"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2.0.21"
tiny_http = "0.12"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"

[build-dependencies]
winresource = "0.1"
